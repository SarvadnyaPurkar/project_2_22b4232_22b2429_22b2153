name: gnr_project_env

channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip

  # Core
  - numpy
  - pandas
  - pillow

  # GPU PyTorch (IMPORTANT)
  - pytorch
  - torchvision
  - torchaudio
  - pytorch-cuda=12.1

  - pip:
      - transformers>=4.40.0
      - accelerate
      - sentencepiece
      - safetensors
      - tqdm